# ──────────────────────────────────────────────────────────────
# UEHIS — Production Docker Compose Configuration
# Target: AWS Elastic Beanstalk Docker Platform (Single EC2)
# Architecture: Nginx Reverse Proxy + Next.js 16 + FastAPI
# Data Tier: Retains Supabase-Managed PostgreSQL/PostGIS & Auth
# ──────────────────────────────────────────────────────────────

services:
  # ── Nginx Reverse Proxy (Public Entry Point) ─────────────────
  proxy:
    image: nginx:alpine
    container_name: uehis-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - uehis-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Next.js 16 / React 19 Web Application ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY:-}
    image: uehis-frontend:latest
    container_name: uehis-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - uehis-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 3000
      PYTHON_SERVICE_URL: http://api:8000
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-${NEXT_PUBLIC_SUPABASE_URL}}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_MAPTILER_API_KEY: ${NEXT_PUBLIC_MAPTILER_API_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY}
      MAPTILER_API_KEY: ${MAPTILER_API_KEY}
      UEHIS_API_KEY: ${UEHIS_API_KEY}
      AUTH_IP_FLOOD_LIMIT: ${AUTH_IP_FLOOD_LIMIT:-30}
      AUTH_IP_FLOOD_WINDOW_MS: ${AUTH_IP_FLOOD_WINDOW_MS:-60000}
      AUTH_LOGIN_MAX_FAILED_ATTEMPTS: ${AUTH_LOGIN_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_MS: ${AUTH_LOGIN_WINDOW_MS:-60000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── FastAPI Geospatial Microservice (Python 3.12 + GDAL) ────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: uehis-api:latest
    container_name: uehis-api
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - uehis-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-${DATABASE_URL}}
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      UEHIS_API_KEY: ${UEHIS_API_KEY:-}
      UEHIS_UNET_RASTER: UEHIS_Production_2026/pune_unet_segmentation_FROZEN_2026.tif
      UEHIS_TEST_NO_GEE: ${UEHIS_TEST_NO_GEE:-0}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  uehis-net:
    driver: bridge
